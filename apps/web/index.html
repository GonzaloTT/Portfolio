<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080B09" />
    <script>
      try {
        if (localStorage.getItem('portfolio-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#F5F7F3'
        }
      } catch {
        // Use the default theme when storage is unavailable.
      }
    </script>
    <meta name="description" content="Gonzalo Magaña Segovia — Full Stack Developer & UX/UI Designer. Selected work, professional experience, and ways to connect." />
    <title>Portfolio | Gonzalo Magaña Segovia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
